# Destinations the dashboard can explain. Longest matching suffix wins.
# category: telemetry | advertising | update | content | cloud | sign-in | security | sync |
#           communication | gaming | cdn | connectivity | store | ai | developer | licensing
# "breaks" says what stops working if the destination is blocked; for Microsoft entries it follows
# Microsoft's "Connection endpoints for Windows 11" page.

