  breaks: Diagnostic and usage data is not sent to Microsoft. Update-failure reports are not sent either.
  suffixes: [v10.events.data.microsoft.com, v10c.events.data.microsoft.com, v10.vortex-win.data.microsoft.com,
             v20.events.data.microsoft.com, self.events.data.microsoft.com, functional.events.data.microsoft.com,
