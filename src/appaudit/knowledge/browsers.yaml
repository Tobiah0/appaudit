# Browsers: what a browser sends about itself, as opposed to what the websites you open in it send.
#
# A browser contacts Google Analytics, Facebook's pixel and ad networks because the pages you visit
# load them. That is website tracking, shown separately. Only the hosts listed under "own" are the
# browser's own reporting (usage data, experiments, crash reports).
#
# programs: process names. own: host suffixes the browser itself reports to.

- name: Firefox
  programs: [firefox.exe]
  own: [telemetry.mozilla.org, normandy.cdn.mozilla.net, classify-client.services.mozilla.com,
        experiments.mozilla.org, crash-stats.mozilla.org, crash-reports.mozilla.com, merino.services.mozilla.com]
- name: Chrome
  programs: [chrome.exe]
  own: [clientservices.googleapis.com, clients4.google.com, optimizationguide-pa.googleapis.com,
        content-autofill.googleapis.com, crashpad.chromium.org, clients2.google.com]
- name: Edge
  programs: [msedge.exe]
  own: [browser.events.data.msn.com, browser.events.data.microsoft.com, config.edge.skype.com, edge.microsoft.com,
        nav-edge.smartscreen.microsoft.com, self.events.data.microsoft.com]
- name: Brave
  programs: [brave.exe]
  own: [p3a.brave.com, p3a-json.brave.com, variations.brave.com, laptop-updates.brave.com]
- name: Opera
  programs: [opera.exe]
  own: [stats.opera.com, sitecheck.opera.com]
- name: Vivaldi
  programs: [vivaldi.exe]
  own: [update.vivaldi.com]
